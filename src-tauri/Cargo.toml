[package]
name = "fintrax"
version = "1.0.0"
description = "Fintrax personal finance tracker"
authors = ["Fintrax"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "fintrax_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
reqwest = { version = "0.12", features = ["blocking"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
