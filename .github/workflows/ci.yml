name: CI

on:
  push:
    branches: [master]
  pull_request:

# A second push to the same branch cancels the run still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # The OCR stack (rapidocr-onnxruntime, opencv, numpy) installs here but is
      # never imported by the tests -- api/receipts.py loads it lazily -- so the
      # runner needs no libgl1/libglib2.0-0. Add them here if that ever changes.
      - name: Install dependencies
        run: pip install -r requirements.txt

      # No env vars needed: FINTRAX_DATA_DIR is unset, so settings.py falls back
      # to dev mode (SQLite + hardcoded key). Every outbound call is patched.
      - name: Run tests
        run: python manage.py test --verbosity 2

  frontend:
    name: Frontend lint, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      # Catches build-time breakage (bad imports, Vite config) that the unit
      # tests miss. Writes frontend/dist only; src-tauri/ui is untouched.
      - name: Build
        run: npm run build
